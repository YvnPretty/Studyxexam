<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studyxexam · API REST</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1220;color:#f0f5ff}main{max-width:790px;margin:auto;padding:24px 16px 70px}h1{margin-bottom:6px}p{color:#a9bad1}.card{background:#162238;border:1px solid #34445e;border-radius:16px;padding:22px;margin:16px 0}.question{font-weight:650;font-size:1.13rem;margin-bottom:15px}.option{display:block;padding:13px;margin:9px 0;border:1px solid #40536d;border-radius:10px;cursor:pointer}.option:has(input:checked){background:#234f57;border-color:#65d7b6}input{margin-right:10px}button{padding:13px 20px;background:#64dabb;border:0;border-radius:10px;color:#09251d;font-weight:750;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px}.secondary{background:#34465f;color:white}.correct{color:#7df0c1}.wrong{color:#ffa5a5}.small{font-size:.9rem;color:#acbdd3}progress{width:100%;height:10px;accent-color:#65d7b6}#result{display:none}footer{margin-top:30px;color:#8da0bc;font-size:.85rem}</style></head><body><main><h1>Studyxexam</h1><p>Examen de API REST, PHP, Laravel y MongoDB · 30 preguntas · 100 puntos</p><progress id="progress" value="0" max="30"></progress><p id="counter" class="small">0 de 30 respondidas</p><section id="quiz"></section><section id="result"></section><footer>Examen de práctica para estudiar. Tus respuestas se califican en este dispositivo; no se envían a un servidor.</footer></main><script>
const questions=[["¿Qué significa API?","Application Programming Interface","Advanced Programming Internet","Application Protocol Integration","Automated Program Interface",0],["¿Cuál es la función principal de una API?","Diseñar interfaces gráficas","Permitir comunicación entre sistemas","Sustituir bases de datos","Instalar aplicaciones",1],["¿Qué tipo de API utiliza recursos identificados mediante URI y métodos HTTP?","SOAP","GraphQL","REST","SMTP",2],["¿Qué tecnología utiliza XML y frecuentemente contratos WSDL?","SOAP","REST","JSON","MongoDB",0],["¿Qué tecnología permite solicitar campos específicos?","SOAP","FTP","REST","GraphQL",3],["¿Qué API está destinada a sistemas internos de una organización?","Pública","Privada","De socios","Abierta",1],["¿Qué API se comparte con colaboradores autorizados?","Pública","Local","De socios","Anónima",2],["¿Qué método HTTP se utiliza para consultar registros?","POST","DELETE","PUT","GET",3],["¿Qué método se utiliza normalmente para crear un recurso?","POST","GET","DELETE","HEAD",0],["¿Qué método HTTP reemplaza completamente un recurso?","GET","PUT","PATCH","DELETE",1],["¿Qué método modifica parcialmente un recurso?","POST","GET","PATCH","OPTIONS",2],["¿Qué método HTTP elimina un recurso?","DELETE","POST","GET","PUT",0],["¿Qué formato es habitual para intercambiar datos en API REST?","MP4","JSON","EXE","CSS",1],["¿Qué es un endpoint?","Un motor de base de datos","Un lenguaje de programación","Una URL de acceso a un recurso u operación","Un servidor DNS",2],["¿Qué código HTTP indica una petición exitosa?","404","500","401","200",3],["¿Qué código HTTP indica que se creó un recurso?","201","204","403","503",0],["¿Qué significa HTTP 204?","Acceso denegado","Éxito sin cuerpo de respuesta","Error de validación","Servidor saturado",1],["¿Qué código indica que falta autenticación válida?","403","404","401","200",2],["¿Qué código indica que el acceso está prohibido?","201","204","500","403",3],["¿Qué código indica un recurso inexistente?","404","422","429","503",0],["¿Qué código utiliza habitualmente Laravel para errores de validación en una API?","200","422","503","301",1],["¿Qué código indica demasiadas peticiones?","204","401","429","500",2],["¿Qué código representa un error interno del servidor?","400","201","403","500",3],["¿Qué es CORS?","Un mecanismo de control de acceso entre orígenes en navegadores","Una base de datos","Un método HTTP","Un framework PHP",0],["¿Qué herramienta nativa de JavaScript permite consumir API?","Composer","fetch()","Artisan","Eloquent",1],["¿Qué bibliotecas se utilizan para consumir API en Android?","Blade y Artisan","Sanctum y Eloquent","Retrofit y Volley","Git y Composer",2],["¿Qué herramienta de Laravel se utiliza para autenticación mediante tokens?","Blade","Vite","Eloquent","Sanctum",3],["¿Qué herramienta permite probar y documentar API?","Postman","MongoDB Shell","Git Bash","Nginx",0],["¿Qué extensión de VS Code permite probar peticiones HTTP?","Live Server","Thunder Client","Prettier","ESLint",1],["¿Qué ventaja ofrece MongoDB al trabajar con Laravel?","Obliga a usar tablas relacionales","Elimina la necesidad de seguridad","Permite documentos flexibles y datos anidados","Impide utilizar JSON",2]];let answers=Array(questions.length).fill(null),page=0;const $=id=>document.getElementById(id);function render(){let start=page*5;$('quiz').innerHTML='<h2>Bloque '+(page+1)+' de 6</h2>'+questions.slice(start,start+5).map((q,j)=>{let i=start+j;return '<article class="card"><div class="small">Pregunta '+(i+1)+' de 30</div><div class="question">'+q[0]+'</div>'+q.slice(1,5).map((o,k)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+k+'" '+(answers[i]===k?'checked':'')+'>'+String.fromCharCode(65+k)+'. '+o+'</label>').join('')+'</article>'}).join('')+'<div class="actions"><button class="secondary" id="prev" '+(page===0?'disabled':'')+'>Anterior</button><span>'+(page+1)+'/6</span><button id="next">'+(page===5?'Calificar':'Siguiente')+'</button></div>';document.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',()=>{answers[+el.name.slice(1)]=+el.value;progress()}));$('prev').onclick=()=>{page--;render();scrollTo(0,0)};$('next').onclick=()=>{if(page<5){page++;render();scrollTo(0,0)}else if(answers.some(a=>a===null)){alert('Responde todas las preguntas antes de calificar.');page=Math.floor(answers.findIndex(a=>a===null)/5);render();scrollTo(0,0)}else finish()};progress()}function progress(){let n=answers.filter(a=>a!==null).length;$('progress').value=n;$('counter').textContent=n+' de 30 respondidas'}function finish(){let n=questions.filter((q,i)=>answers[i]===q[5]).length;$('quiz').style.display='none';$('result').style.display='block';$('result').innerHTML='<div class="card"><h2>Resultado: '+Math.round(n/30*100)+'/100</h2><p>'+n+' respuestas correctas de 30</p><button id="retry">Repetir examen</button></div><h2>Revisión de respuestas</h2>'+questions.map((q,i)=>'<article class="card"><div class="question">'+(i+1)+'. '+q[0]+'</div><p class="'+(answers[i]===q[5]?'correct':'wrong')+'">Tu respuesta: '+q[answers[i]+1]+'</p><p>Respuesta correcta: <strong>'+q[q[5]+1]+'</strong></p></article>').join('');$('retry').onclick=()=>{answers.fill(null);page=0;$('quiz').style.display='block';$('result').style.display='none';render();scrollTo(0,0)};scrollTo(0,0)}render();
</script></body></html>
